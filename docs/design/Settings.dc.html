<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&amp;family=Caveat:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#23262B;text-decoration-color:#A9D6E5}a:hover{color:#23262B}
</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; background: #F7F5F0; color: #23262B; font-family: 'Nunito', system-ui, sans-serif; display: flex">

<nav aria-label="Main menu" style="width: 200px; box-sizing: border-box; padding: 24px 16px; border-right: 2px solid #C9C6BF; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; padding: 0 8px 18px">
<svg width="30" height="30" viewBox="-24 -21 46 44" fill="none" stroke="#23262B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="-16" cy="-10" r="7" fill="#5A3B2E"></circle>
<circle cx="0" cy="0" r="17" fill="#FFF4DC"></circle>
<path d="M -17 3 A 17 17 0 0 1 13 -11 Q 3 -5 -5 -7 Q -10 -1 -11 7 Z" fill="#5A3B2E"></path>
<path d="M -5 0 Q -2 -5 1 0 M 6 0 Q 9 -5 12 0"></path>
<path d="M -1 7 Q 4 12 9 7"></path>
</svg>
SitWise
</div>
<a href="Dashboard.dc.html" style="padding: 12px; border-radius: 12px; color: #C9C6BF; text-decoration: none; font-weight: 600">Dashboard</a>
<a href="Calibration.dc.html" style="padding: 12px; border-radius: 12px; color: #C9C6BF; text-decoration: none; font-weight: 600">Calibration</a>
<a href="RecordingSetup.dc.html" style="padding: 12px; border-radius: 12px; color: #C9C6BF; text-decoration: none; font-weight: 600">Recording</a>
<a href="Settings.dc.html" aria-current="page" style="padding: 12px; border-radius: 12px; background: #A9D6E5; color: #23262B; text-decoration: none; font-weight: 800">Settings</a>
</nav>

<main style="flex: 1; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800">Settings</h1>

<fieldset style="margin: 0; border: 2px solid #C9C6BF; border-radius: 16px; background: #FFFFFF; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0 6px; font-weight: 800; font-size: 15px">Alert frequency</legend>
<div style="display: flex; gap: 8px">
<label style="flex: 1; min-height: 44px; box-sizing: border-box; border: 2px solid #C9C6BF; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><input type="radio" name="freq" style="accent-color: #A9D6E5"> Low</label>
<label style="flex: 1; min-height: 44px; box-sizing: border-box; border: 2px solid #A9D6E5; background: #A9D6E5; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800"><input type="radio" name="freq" checked="" style="accent-color: #A9D6E5"> Normal</label>
<label style="flex: 1; min-height: 44px; box-sizing: border-box; border: 2px solid #C9C6BF; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><input type="radio" name="freq" style="accent-color: #A9D6E5"> High</label>
</div>
<span style="font-size: 13px; color: #23262B">At most one alert every 5 minutes for the same problem.</span>
</fieldset>

<fieldset style="margin: 0; border: 2px solid #C9C6BF; border-radius: 16px; background: #FFFFFF; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0 6px; font-weight: 800; font-size: 15px">Break mode</legend>
<div style="display: flex; gap: 8px">
<label style="flex: 1; min-height: 44px; box-sizing: border-box; border: 2px solid #A9D6E5; background: #A9D6E5; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800"><input type="radio" name="brk" checked="" style="accent-color: #A9D6E5"> Pomodoro (25 / 5)</label>
<label style="flex: 1; min-height: 44px; box-sizing: border-box; border: 2px solid #C9C6BF; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><input type="radio" name="brk" style="accent-color: #A9D6E5"> Smart break</label>
<label style="flex: 1; min-height: 44px; box-sizing: border-box; border: 2px solid #C9C6BF; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600"><input type="radio" name="brk" style="accent-color: #A9D6E5"> Off</label>
</div>
</fieldset>

<div style="border: 2px solid #C9C6BF; border-radius: 16px; background: #FFFFFF; padding: 6px 18px; display: flex; flex-direction: column">
<label style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; border-bottom: 1px solid #C9C6BF">Start when the computer starts <input type="checkbox" checked="" style="width: 22px; height: 22px; accent-color: #A9D6E5"></label>
<label style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-weight: 600">Show mini indicator <input type="checkbox" checked="" style="width: 22px; height: 22px; accent-color: #A9D6E5"></label>
</div>

<div style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 2px solid #A9D6E5; border-radius: 16px; padding: 12px 16px">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#23262B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="5" y="11" width="14" height="10" rx="2"></rect>
<path d="M8 11 V8 a4 4 0 0 1 8 0 V11"></path>
</svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<strong style="font-size: 15px">Your camera images stay here</strong>
<span style="font-size: 14px; color: #23262B">Images are not written to disk and are not sent anywhere. Only posture, distance and blink numbers leave the computer.</span>
</div>
</div>
</main>
</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>
